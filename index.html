<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kairo — Asistente de IA</title>

<meta name="description"
content="Kairo es un asistente de inteligencia artificial creado por C. Castro.">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#0f0f0f;
color:white;
font-family:Arial,sans-serif;
}

#app{
width:100%;
max-width:650px;
height:100vh;
margin:auto;
background:#181818;
display:flex;
flex-direction:column;
}

#header{
height:65px;
flex-shrink:0;
display:flex;
align-items:center;
gap:10px;
padding:10px 15px;
border-bottom:1px solid #333;
}

#avatar{
width:43px;
height:43px;
border-radius:50%;
background:#292929;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
}

#name{
font-size:19px;
font-weight:bold;
}

#status{
font-size:12px;
color:#777;
margin-top:2px;
}

#chat{
flex:1;
padding:15px;
overflow-y:auto;
}

.row{
display:flex;
gap:7px;
margin:12px 0;
align-items:flex-end;
}

.row.user{
justify-content:flex-end;
}

.avatar-small{
width:28px;
height:28px;
border-radius:50%;
background:#292929;
display:flex;
align-items:center;
justify-content:center;
font-size:16px;
flex-shrink:0;
}

.bubble{
max-width:78%;
padding:10px 14px;
border-radius:18px;
line-height:1.4;
word-wrap:break-word;
}

.bot .bubble{
background:#eeeeee;
color:#111;
border-bottom-left-radius:5px;
}

.user .bubble{
background:#303030;
color:white;
border-bottom-right-radius:5px;
}

#bottom{
height:65px;
flex-shrink:0;
display:flex;
align-items:center;
gap:7px;
padding:8px 10px;
border-top:1px solid #333;
position:relative;
}

#input{
flex:1;
height:44px;
border:0;
outline:none;
border-radius:23px;
padding:0 16px;
background:#292929;
color:white;
font-size:15px;
}

#input::placeholder{
color:#888;
}

.action{
width:43px;
height:43px;
border:0;
border-radius:50%;
background:#292929;
color:white;
font-size:19px;
cursor:pointer;
flex-shrink:0;
}

.action:active{
transform:scale(.94);
}

#menu{
display:none;
position:absolute;
bottom:62px;
left:8px;
background:#292929;
padding:7px;
border-radius:14px;
box-shadow:0 6px 20px rgba(0,0,0,.4);
z-index:20;
}

.menu-button{
display:block;
width:145px;
padding:11px;
margin:3px;
border:0;
border-radius:10px;
background:#383838;
color:white;
text-align:left;
cursor:pointer;
}

#fileInput{
display:none;
}

@media(max-width:650px){

#app{
height:100vh;
}

}

</style>

</head>

<body>

<div id="app">

<div id="header">

<div id="avatar">
🐉
</div>

<div>

<div id="name">
Kairo
</div>

<div id="status">
En línea
</div>

</div>

</div>


<div id="chat">

<div class="row bot">

<div class="avatar-small">
🐉
</div>

<div class="bubble">
Hola, soy Kairo. ¿En qué puedo ayudarte?
</div>

</div>

</div>


<div id="bottom">

<button
id="plus"
class="action">
+
</button>


<input
id="input"
placeholder="Escribe un mensaje..."
autocomplete="off">


<button
id="send"
class="action">
➤
</button>
 <div id="menu">

<button
id="fileButton"
class="menu-button">
📄 Archivo
</button>

<button
id="imageButton"
class="menu-button">
🖼️ Imagen
</button>

</div>

<input
id="fileInput"
type="file">

</div>

</div>

<script>

const input =
document.getElementById("input");

const send =
document.getElementById("send");

const plus =
document.getElementById("plus");

const menu =
document.getElementById("menu");

const chat =
document.getElementById("chat");

const fileButton =
document.getElementById("fileButton");

const imageButton =
document.getElementById("imageButton");

const fileInput =
document.getElementById("fileInput");


function addUser(text){

const row =
document.createElement("div");

row.className =
"row user";

const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
text;

row.appendChild(bubble);

chat.appendChild(row);

chat.scrollTop =
chat.scrollHeight;

}


function addKairo(text){

const row =
document.createElement("div");

row.className =
"row bot";

const avatar =
document.createElement("div");

avatar.className =
"avatar-small";

avatar.textContent =
"🐉";

const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
text;

row.appendChild(avatar);

row.appendChild(bubble);

chat.appendChild(row);

chat.scrollTop =
chat.scrollHeight;

return bubble;

}


async function sendMessage(){

const text =
input.value.trim();

if(!text){
return;
}

input.value = "";

addUser(text);

const loading =
addKairo("Estoy pensando...");

try{

const response =
await fetch("/api",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:text
})

});

const data =
await response.json();

if(data.answer){

loading.textContent =
data.answer;

}else{

loading.textContent =
"❌ Kairo no pudo responder.";

}

}catch(error){

loading.textContent =
"❌ Error al conectar con Kairo.";

}

chat.scrollTop =
chat.scrollHeight;

}


send.onclick =
sendMessage;


input.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

event.preventDefault();

sendMessage();

}

});


plus.onclick =
function(event){

event.stopPropagation();

if(menu.style.display === "block"){

menu.style.display =
"none";

}else{

menu.style.display =
"block";

}

};


document.addEventListener(
"click",
function(event){

if(
event.target !== plus &&
!menu.contains(event.target)
){

menu.style.display =
"none";

}

});


fileButton.onclick =
function(){

menu.style.display =
"none";

fileInput.accept =
".txt,.pdf,.docx,.csv,.xlsx,.pptx";

fileInput.click();

};


imageButton.onclick =
function(){

menu.style.display =
"none";

fileInput.accept =
"image/*";

fileInput.click();

};


fileInput.onchange =
function(){

if(!fileInput.files.length){
return;
}

const file =
fileInput.files[0];

addUser(
"📎 " + file.name
);

addKairo(
"📄 He recibido el archivo. La lectura de archivos la conectaremos al backend."
);

fileInput.value = "";

};

</script>

</body>

</html>
